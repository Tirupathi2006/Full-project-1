# ============================================================
# RouteWise backend configuration
#
# Every deployment-specific value reads from an environment
# variable with a safe local default, so the same build runs
# locally and in production with nothing hardcoded.
#
# Local dev  : defaults below work as-is against local MySQL
# No MySQL?  : --spring.profiles.active=h2
# Production : set the env vars listed in README "Deployment"
# ============================================================

server.port=${PORT:8080}
spring.application.name=routewise-backend

# --- Datasource ---
# Railway/Render inject these; locally the defaults apply.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/routewise?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool sized for small free-tier instances
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

# --- JPA / schema ---
# schema.sql creates the tables; JPA validates rather than generating DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# REQUIRED in production. Generate with: openssl rand -base64 48
# The local default is for development only and must never be deployed.
routewise.jwt.secret=${JWT_SECRET:local-development-only-secret-do-not-use-in-production-0123456789}
routewise.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of allowed frontend origins.
# Production example: https://routewise.vercel.app
routewise.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator health endpoint (used by platform health checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
