# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# In-memory database — nothing to install, data resets on every restart.

spring.datasource.url=jdbc:h2:mem:routewise;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Unlike the MySQL profile (which validates against tables you created with
# schema.sql), H2 starts empty every run, so let Hibernate build the schema
# and skip schema.sql entirely.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
